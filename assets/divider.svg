<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70"><title>Lavender wave divider</title><defs><linearGradient id="g"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#f0abfc"/><stop offset="1" stop-color="#89ddff"/></linearGradient></defs><style>.wave{animation:wave 7s ease-in-out infinite alternate}.dots{stroke-dasharray:2 28;animation:flow 12s linear infinite}@keyframes wave{to{transform:translateY(8px)}}@keyframes flow{to{stroke-dashoffset:-300}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="wave" d="M0 32Q150 4 300 32T600 32T900 32T1200 32" fill="none" stroke="url(#g)" stroke-width="2" opacity=".7"/><path class="wave dots" d="M0 41Q150 69 300 41T600 41T900 41T1200 41" fill="none" stroke="url(#g)" stroke-width="4" opacity=".6"/></svg>