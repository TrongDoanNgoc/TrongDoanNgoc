<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
<title id="title">Doan Ngoc Trong — Mobile and Web Engineer</title><desc id="desc">Custom animated profile artwork. Motion is disabled when reduced motion is preferred.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,Consolas,monospace}
.float{animation:float 7s ease-in-out infinite}.float-slow{animation:float 9s ease-in-out infinite reverse}
.flow{stroke-dasharray:10 18;animation:flow 12s linear infinite}.trace{stroke-dasharray:700;stroke-dashoffset:0;animation:trace 8s ease-in-out infinite}
.orbit{transform-origin:900px 283px;animation:orbit 36s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes flow{to{stroke-dashoffset:-280}}@keyframes trace{0%,12%{stroke-dashoffset:700}55%,100%{stroke-dashoffset:0}}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.float,.float-slow,.flow,.trace,.orbit,.pulse{animation:none!important}}
</style>
