<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="title desc">
<title id="title">Let’s make it real. Contact Doan Ngoc Trong.</title><desc id="desc">Custom animated profile artwork. Motion is disabled when reduced motion is preferred.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,Consolas,monospace}
.float{animation:float 4.5s ease-in-out infinite}.float-slow{animation:float 6s ease-in-out infinite reverse}
.flow{stroke-dasharray:10 18;animation:flow 6s linear infinite}.trace{stroke-dasharray:700;stroke-dashoffset:0;animation:trace 5s ease-in-out infinite}
.orbit{transform-origin:900px 283px;animation:orbit 18s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes flow{to{stroke-dashoffset:-280}}@keyframes trace{0%{stroke-dashoffset:300}55%,100%{stroke-dashoffset:0}}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.float,.float-slow,.flow,.trace,.orbit,.pulse{animation:none!important}}

/* Lavender motion tokens: slow ambient movement, independent accent loops. */
.aurora{transform-box:fill-box;transform-origin:center;animation:aurora 13s ease-in-out infinite alternate}
.aurora-two{animation-delay:-6s;animation-direction:alternate-reverse}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 4s ease-in-out infinite}
.flower{transform-box:fill-box;transform-origin:center;animation:flower 24s linear infinite}
.shoot{animation:shoot 8s ease-out infinite;opacity:0}
.wave{animation:wave 9s ease-in-out infinite alternate}
.gradient-title{fill:url(#candy)}
@keyframes aurora{from{transform:translate(-35px,15px) scale(.9);opacity:.45}to{transform:translate(35px,-20px) scale(1.2);opacity:.9}}
@keyframes spark{0%,100%{opacity:.2;transform:scale(.65)}50%{opacity:1;transform:scale(1.2)}}
@keyframes flower{to{transform:rotate(360deg)}}
@keyframes shoot{0%,65%{opacity:0;transform:translate(0,0)}70%{opacity:.9}85%,100%{opacity:0;transform:translate(-210px,130px)}}
@keyframes wave{from{transform:translateX(-25px)}to{transform:translateX(25px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.shoot{opacity:0}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#302644" stroke-width=".6"/></pattern>
<radialGradient id="halo"><stop stop-color="#c4b5fd" stop-opacity=".13"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
<linearGradient id="line"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#89ddff"/></linearGradient>
<radialGradient id="violetGlow"><stop stop-color="#a78bfa" stop-opacity=".5"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="pinkGlow"><stop stop-color="#f0abfc" stop-opacity=".4"/><stop offset="1" stop-color="#f0abfc" stop-opacity="0"/></radialGradient>
<linearGradient id="candy" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#c4b5fd"/><stop offset=".5" stop-color="#f0abfc"/><stop offset="1" stop-color="#89ddff"/></linearGradient>
<linearGradient id="comet"><stop stop-color="#f0abfc" stop-opacity="0"/><stop offset="1" stop-color="#ede9fe"/></linearGradient></defs>
<rect width="600" height="250" rx="24" fill="#110e1b"/><g><ellipse class="aurora" cx="420.0" cy="70.0" rx="270.0" ry="125.0" fill="url(#violetGlow)"/><ellipse class="aurora aurora-two" cx="120.0" cy="205.0" rx="240.0" ry="112.5" fill="url(#pinkGlow)"/></g>
<circle cx="550" cy="120" r="200" fill="url(#halo)"/>
<text x="32" y="45" class="mono" font-size="13" letter-spacing="2" fill="#c4b5fd">THE NEXT GREAT PRODUCT</text>
<text x="30" y="103" font-size="48" font-weight="bold" fill="#f5f0ff" letter-spacing="-1">Let's make it real.</text>
<text x="32" y="146" font-size="19" fill="#c7bddb">Thoughtful details. Reliable systems.</text>
<text x="32" y="175" font-size="19" fill="#c7bddb">Something people love.</text>
<path d="M455 206H566M550 190L566 206L550 222" fill="none" stroke="#c4b5fd" stroke-width="3"/>
<path d="M455 206H566" class="flow" stroke="#110e1b" stroke-width="4"/>
<path class="spark" style="animation-delay:-0.00s" d="M510 236h6M513 233v6" stroke="#c4b5fd" stroke-width="1.5"/><path class="spark" style="animation-delay:-0.37s" d="M171 215h6M174 212v6" stroke="#f0abfc" stroke-width="1.5"/><path class="spark" style="animation-delay:-0.74s" d="M519 235h6M522 232v6" stroke="#89ddff" stroke-width="1.5"/><path class="spark" style="animation-delay:-1.11s" d="M258 25h6M261 22v6" stroke="#c4b5fd" stroke-width="1.5"/><path class="spark" style="animation-delay:-1.48s" d="M475 220h6M478 217v6" stroke="#f0abfc" stroke-width="1.5"/><path class="spark" style="animation-delay:-1.85s" d="M240 9h6M243 6v6" stroke="#89ddff" stroke-width="1.5"/><path class="spark" style="animation-delay:-2.22s" d="M101 236h6M104 233v6" stroke="#c4b5fd" stroke-width="1.5"/><g transform="translate(558 43) scale(0.8)"><g class="flower"><ellipse cy="-12" rx="7" ry="14" transform="rotate(0)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(60)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(120)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(180)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(240)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(300)" fill="url(#candy)"/><circle r="5" fill="#110e1b"/></g></g><g transform="translate(440 145) scale(0.5)"><g class="flower"><ellipse cy="-12" rx="7" ry="14" transform="rotate(0)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(60)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(120)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(180)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(240)" fill="url(#candy)"/><ellipse cy="-12" rx="7" ry="14" transform="rotate(300)" fill="url(#candy)"/><circle r="5" fill="#110e1b"/></g></g></svg>
