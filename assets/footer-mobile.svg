<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="title desc">
<title id="title">Let’s make it real. Contact Doan Ngoc Trong.</title><desc id="desc">Custom animated profile artwork. Motion is disabled when reduced motion is preferred.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,Consolas,monospace}
.float{animation:float 7s ease-in-out infinite}.float-slow{animation:float 9s ease-in-out infinite reverse}
.flow{stroke-dasharray:10 18;animation:flow 12s linear infinite}.trace{stroke-dasharray:700;stroke-dashoffset:0;animation:trace 8s ease-in-out infinite}
.orbit{transform-origin:900px 283px;animation:orbit 36s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes flow{to{stroke-dashoffset:-280}}@keyframes trace{0%,12%{stroke-dashoffset:700}55%,100%{stroke-dashoffset:0}}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.float,.float-slow,.flow,.trace,.orbit,.pulse{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#25312c" stroke-width=".6"/></pattern>
<radialGradient id="halo"><stop stop-color="#baff59" stop-opacity=".13"/><stop offset="1" stop-color="#baff59" stop-opacity="0"/></radialGradient>
<linearGradient id="line"><stop stop-color="#baff59"/><stop offset="1" stop-color="#58dbc4"/></linearGradient>
</defs>
<rect width="600" height="250" rx="24" fill="#0c1210"/>
<circle cx="550" cy="120" r="200" fill="url(#halo)"/>
<text x="32" y="45" class="mono" font-size="13" letter-spacing="2" fill="#baff59">THE NEXT GREAT PRODUCT</text>
<text x="30" y="103" font-size="48" font-weight="bold" fill="#eef3e7" letter-spacing="-1">Let's make it real.</text>
<text x="32" y="146" font-size="19" fill="#b5c1ae">Thoughtful details. Reliable systems.</text>
<text x="32" y="175" font-size="19" fill="#b5c1ae">Something people love.</text>
<path d="M455 206H566M550 190L566 206L550 222" fill="none" stroke="#baff59" stroke-width="3"/>
<path d="M455 206H566" class="flow" stroke="#0c1210" stroke-width="4"/>
</svg>
