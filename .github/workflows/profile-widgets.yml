name: Profile extensions

on:
  workflow_dispatch:
  schedule:
    - cron: '45 2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-widgets.yml'
      - '.github/profile-3d.json'
      - 'scripts/style-widgets.py'
      - 'scripts/render-widgets.py'

permissions:
  contents: read
concurrency:
  group: profile-extensions
  cancel-in-progress: false

jobs:
  city:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_3D_TOKEN || github.token }}
          USERNAME: TrongDoanNgoc
          SETTING_JSON: .github/profile-3d.json
      - uses: actions/upload-artifact@v4
        with:
          name: widget-city
          path: profile-3d-contrib/lavender-city*.svg
          if-no-files-found: error
          retention-days: 2

  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: TrongDoanNgoc
          github_token: ${{ github.token }}
          games: galaga
      - name: Collect arcade art
        run: |
          mkdir -p assets/widgets
          cp dist/galaga-contribution-graph-dark.svg assets/widgets/galaga.svg
      - uses: actions/upload-artifact@v4
        with:
          name: widget-arcade
          path: assets/widgets/galaga.svg
          if-no-files-found: error
          retention-days: 2

  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ github.token }}
          user: TrongDoanNgoc
          filename: metrics.svg
          output_action: none
          base: ''
          config_timezone: Asia/Ho_Chi_Minh
          config_display: large
          repositories: 100
          repositories_forks: false
          plugin_languages: true
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_colors: '#c4b5fd, #f0abfc, #89ddff, #ac87df, #e9d5ff, #a5b4fc'
          plugin_notable: true
          plugin_notable_from: all
          plugin_notable_repositories: true
          extras_css: |
            svg { background: #171122; border-radius: 18px; }
            * { --color-text: #f5f0ff; --color-text-muted: #c7bddb; --color-text-accent: #c4b5fd; }
      - uses: actions/upload-artifact@v4
        with:
          name: widget-metrics
          path: /metrics_renders/metrics.svg
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [city, arcade, metrics]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: widget-*
          merge-multiple: true
          path: assets/widgets
      - name: Apply lavender palette
        run: python3 scripts/style-widgets.py
      - name: Refresh writing feed when configured
        if: vars.PROFILE_BLOG_FEED != ''
        uses: gautamkrishnar/blog-post-workflow@28b22c9f8c9f4fa4b1c3e210bd5c3aaa00dff596
        with:
          feed_list: ${{ vars.PROFILE_BLOG_FEED }}
          readme_path: assets/feeds/posts.md
          max_post_count: 4
          skip_commit: true
          gh_token: ${{ github.token }}
      - name: Render available widgets
        env:
          PROFILE_BLOG_FEED: ${{ vars.PROFILE_BLOG_FEED }}
          SPOTIFY_WIDGET_URL: ${{ vars.SPOTIFY_WIDGET_URL }}
        run: python3 scripts/render-widgets.py
      - name: Publish extensions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/widgets assets/feeds README.md
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Refresh profile extensions'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
